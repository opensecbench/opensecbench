# OpenSecBench route-map starter ruleset (ADR-0033). These semgrep rules identify HTTP route registrations
# across common frameworks. Each captures the route path in a `$ROUTE` metavariable and declares the HTTP
# method + framework in `metadata`, which pkg/interpret/routes.go reads into the routes inventory. This is a
# deliberately small starter set — extend it per framework by following the same shape (capture `$ROUTE`,
# set metadata.method + metadata.framework). Route detection is heuristic; it finds declared entry points,
# not a call graph.
rules:
  # --- Python: Flask / FastAPI ---
  - id: osb-route-flask
    languages: [python]
    severity: INFO
    message: "Flask route $ROUTE"
    metadata: {osb_route: true, framework: flask}
    pattern: "@$APP.route($ROUTE, ...)"

  - id: osb-route-fastapi-get
    languages: [python]
    severity: INFO
    message: "FastAPI GET $ROUTE"
    metadata: {osb_route: true, framework: fastapi, method: GET}
    pattern: "@$APP.get($ROUTE, ...)"
  - id: osb-route-fastapi-post
    languages: [python]
    severity: INFO
    message: "FastAPI POST $ROUTE"
    metadata: {osb_route: true, framework: fastapi, method: POST}
    pattern: "@$APP.post($ROUTE, ...)"
  - id: osb-route-fastapi-put
    languages: [python]
    severity: INFO
    message: "FastAPI PUT $ROUTE"
    metadata: {osb_route: true, framework: fastapi, method: PUT}
    pattern: "@$APP.put($ROUTE, ...)"
  - id: osb-route-fastapi-delete
    languages: [python]
    severity: INFO
    message: "FastAPI DELETE $ROUTE"
    metadata: {osb_route: true, framework: fastapi, method: DELETE}
    pattern: "@$APP.delete($ROUTE, ...)"

  # --- JavaScript / TypeScript: Express ---
  - id: osb-route-express-get
    languages: [javascript, typescript]
    severity: INFO
    message: "Express GET $ROUTE"
    metadata: {osb_route: true, framework: express, method: GET}
    pattern: $APP.get($ROUTE, $HANDLER, ...)
  - id: osb-route-express-post
    languages: [javascript, typescript]
    severity: INFO
    message: "Express POST $ROUTE"
    metadata: {osb_route: true, framework: express, method: POST}
    pattern: $APP.post($ROUTE, $HANDLER, ...)
  - id: osb-route-express-put
    languages: [javascript, typescript]
    severity: INFO
    message: "Express PUT $ROUTE"
    metadata: {osb_route: true, framework: express, method: PUT}
    pattern: $APP.put($ROUTE, $HANDLER, ...)
  - id: osb-route-express-delete
    languages: [javascript, typescript]
    severity: INFO
    message: "Express DELETE $ROUTE"
    metadata: {osb_route: true, framework: express, method: DELETE}
    pattern: $APP.delete($ROUTE, $HANDLER, ...)

  # --- Go: net/http and gin ---
  - id: osb-route-go-nethttp
    languages: [go]
    severity: INFO
    message: "net/http route $ROUTE"
    metadata: {osb_route: true, framework: net-http}
    patterns:
      - pattern-either:
          - pattern: http.HandleFunc($ROUTE, $HANDLER)
          - pattern: $MUX.HandleFunc($ROUTE, $HANDLER)
  - id: osb-route-gin-get
    languages: [go]
    severity: INFO
    message: "gin GET $ROUTE"
    metadata: {osb_route: true, framework: gin, method: GET}
    pattern: $R.GET($ROUTE, $HANDLER, ...)
  - id: osb-route-gin-post
    languages: [go]
    severity: INFO
    message: "gin POST $ROUTE"
    metadata: {osb_route: true, framework: gin, method: POST}
    pattern: $R.POST($ROUTE, $HANDLER, ...)

  # --- Java: Spring MVC / WebFlux (annotation-declared) ---
  # Method-level mappings only. A class-level @RequestMapping prefix is NOT composed onto these (semgrep
  # matches per-annotation with no class context), so a path here may be relative to a controller prefix —
  # honest partial coverage (ADR-0033: route detection is heuristic). Covers positional ("/x"), value=, and
  # path= argument forms; the array form (@GetMapping({"/a","/b"})) captures the first path.
  - id: osb-route-spring-get
    languages: [java]
    severity: INFO
    message: "Spring GET $ROUTE"
    metadata: {osb_route: true, framework: spring, method: GET}
    patterns:
      - pattern-either:
          - pattern: "@GetMapping($ROUTE)"
          - pattern: "@GetMapping(value = $ROUTE, ...)"
          - pattern: "@GetMapping(path = $ROUTE, ...)"
          - pattern: "@GetMapping({$ROUTE, ...})"
  - id: osb-route-spring-post
    languages: [java]
    severity: INFO
    message: "Spring POST $ROUTE"
    metadata: {osb_route: true, framework: spring, method: POST}
    patterns:
      - pattern-either:
          - pattern: "@PostMapping($ROUTE)"
          - pattern: "@PostMapping(value = $ROUTE, ...)"
          - pattern: "@PostMapping(path = $ROUTE, ...)"
          - pattern: "@PostMapping({$ROUTE, ...})"
  - id: osb-route-spring-put
    languages: [java]
    severity: INFO
    message: "Spring PUT $ROUTE"
    metadata: {osb_route: true, framework: spring, method: PUT}
    patterns:
      - pattern-either:
          - pattern: "@PutMapping($ROUTE)"
          - pattern: "@PutMapping(value = $ROUTE, ...)"
          - pattern: "@PutMapping(path = $ROUTE, ...)"
          - pattern: "@PutMapping({$ROUTE, ...})"
  - id: osb-route-spring-delete
    languages: [java]
    severity: INFO
    message: "Spring DELETE $ROUTE"
    metadata: {osb_route: true, framework: spring, method: DELETE}
    patterns:
      - pattern-either:
          - pattern: "@DeleteMapping($ROUTE)"
          - pattern: "@DeleteMapping(value = $ROUTE, ...)"
          - pattern: "@DeleteMapping(path = $ROUTE, ...)"
          - pattern: "@DeleteMapping({$ROUTE, ...})"
  - id: osb-route-spring-patch
    languages: [java]
    severity: INFO
    message: "Spring PATCH $ROUTE"
    metadata: {osb_route: true, framework: spring, method: PATCH}
    patterns:
      - pattern-either:
          - pattern: "@PatchMapping($ROUTE)"
          - pattern: "@PatchMapping(value = $ROUTE, ...)"
          - pattern: "@PatchMapping(path = $ROUTE, ...)"
          - pattern: "@PatchMapping({$ROUTE, ...})"
  # @RequestMapping is used at both class and method level and its method attribute is optional, so no HTTP
  # method is asserted here (left blank = any). Matches the common path-bearing forms.
  - id: osb-route-spring-request
    languages: [java]
    severity: INFO
    message: "Spring route $ROUTE"
    metadata: {osb_route: true, framework: spring}
    patterns:
      - pattern-either:
          - pattern: "@RequestMapping($ROUTE)"
          - pattern: "@RequestMapping(value = $ROUTE, ...)"
          - pattern: "@RequestMapping(path = $ROUTE, ...)"
          - pattern: "@RequestMapping({$ROUTE, ...})"
